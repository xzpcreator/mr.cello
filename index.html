<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提琴先生・排課系統</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#F1F2EE;--card:#fff;--ink:#1D2A36;--mut:#66727C;--line:#D6DAD3;--acc:#8A2E3B;--acc2:#F3E3E4;--bad:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B22;--card:#1C252E;--ink:#E8ECEA;--mut:#93A0A9;--line:#2D3943;--acc:#E08A95;--acc2:#3A2428;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#141B22;--card:#1C252E;--ink:#E8ECEA;--mut:#93A0A9;--line:#2D3943;--acc:#E08A95;--acc2:#3A2428;--bad:#FF8A80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Noto Sans TC",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 24px;padding:20px 24px 0;max-width:1100px;margin:auto}
h1{font:900 30px/1.2 "Noto Serif TC",serif;margin:0;letter-spacing:.08em}
header p{margin:0;color:var(--mut)}
nav{display:flex;gap:4px;max-width:1100px;margin:14px auto 0;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:700}
main{max-width:1100px;margin:auto;padding:20px 24px 60px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 16px;font:500 14px "Noto Sans TC",sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.del{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar h2{font:600 20px "Noto Serif TC",serif;margin:0 auto 0 0}
.days{display:grid;grid-template-columns:auto repeat(7,minmax(54px,1fr)) auto;gap:6px;margin-bottom:14px;overflow-x:auto}
.days button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit;line-height:1.3;cursor:pointer}
.days button small{display:block;color:inherit;opacity:.7;font-size:12px}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button.td{box-shadow:inset 0 -3px var(--acc)}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);padding-bottom:12px}
.grid{display:grid;grid-template-columns:52px repeat(3,minmax(170px,1fr));min-width:640px}
.hd{padding:10px 12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.hd b{font:600 18px "Noto Serif TC",serif}.hd small{display:block;color:var(--mut);font-size:12px}
.tc{position:relative;height:960px}.tc span{position:absolute;right:8px;font-size:11px;color:var(--mut);transform:translateY(-8px)}
.col{position:relative;height:960px;border-left:1px solid var(--line);cursor:copy;
background:repeating-linear-gradient(to bottom,transparent 0 59px,var(--line) 59px 60px)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.les{position:absolute;left:4px;right:4px;border-radius:5px;padding:4px 8px;font-size:12.5px;line-height:1.35;overflow:hidden;cursor:pointer;
background:color-mix(in srgb,var(--c) 16%,var(--card));border-left:4px solid var(--c);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.les.past{opacity:.6}.les.dim{opacity:.18}
.les b{display:block}.les em{font-style:normal;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
.rules{margin-top:14px;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px}
.rules ul{margin:4px 0 0;padding-left:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.panel h2{font:600 18px "Noto Serif TC",serif;margin:0 0 10px}.panel h2 small{font:400 13px "Noto Sans TC";color:var(--mut)}
.list{max-height:400px;overflow:auto;padding-right:6px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row small{color:var(--mut)}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;cursor:pointer}
.pick{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px;margin-top:6px}
.pick label{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:4px;cursor:pointer}.pick label:hover{background:var(--acc2)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:22px;width:min(500px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(10,15,20,.5)}
dialog h2{font:600 20px "Noto Serif TC",serif;margin:0 0 12px}
.f{display:grid;gap:4px;margin-bottom:10px}.f>span{font-size:13px;color:var(--mut)}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:0 0 10px}.err div::before{content:"✕ "}
.acts{display:flex;gap:8px;justify-content:flex-end}.acts .del{margin-right:auto}
.empty{color:var(--mut);padding:10px 0}
.btn.red{background:var(--bad);color:#fff}.row [data-open]{cursor:pointer;flex:1}.row [data-open]:hover b{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px}.stat b{display:block;font:600 17px "Noto Serif TC",serif}.stat small{color:var(--mut);display:block}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.mnav b{font-weight:600}
.row.s{font-size:14px}.row.s span:last-child{white-space:nowrap;color:var(--mut)}
.bn{max-width:1100px;margin:10px auto 0;padding:8px 24px;color:var(--bad);font-size:13px}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#login form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%)}
#login h1{font-size:26px;margin-bottom:4px}#login p{color:var(--mut);margin:0 0 16px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.info{color:var(--mut);font-size:13px;margin:-4px 0 10px}
</style>
</head>
<body>
<header><h1>提琴先生</h1><p>音樂工作室排課系統・A／B／C 三間琴房・每日 8:00–24:00</p><div id="who" style="margin-left:auto;font-size:13px;color:var(--mut)"></div></header>
<div id="bn" class="bn">資料載入中…</div>
<nav id="nav"></nav>
<main id="app"></main>
<div id="login"><form id="lform"><h1>提琴先生</h1><p>請登入排課系統</p><label class="f"><span>電子郵件</span><input type="email" id="lmail" required autocomplete="username"></label><label class="f"><span>密碼</span><input type="password" id="lpw" required autocomplete="current-password"></label><div class="err" id="lerr"></div><button class="btn" type="submit" style="width:100%">登入</button></form></div>
<dialog id="dlg"></dialog><dialog id="sdlg"></dialog><dialog id="cdlg"></dialog><dialog id="ddlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const INSTS=['鋼琴','小提琴','大提琴','其他課程','出租'];
const ROOMS={A:{piano:1,note:'有鋼琴'},B:{piano:0,note:'弦樂・其他課程'},C:{piano:1,group:1,note:'有鋼琴・可開團體班'}};
const H0=8,H1=24,COLORS=['#8A2E3B','#2F6F73','#B7791F','#4F5D95','#5E7F3A'];
const KEY='mrviolin-v2',WK='日一二三四五六';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const fmt=s=>{const d=pd(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WK[d.getDay()]};
const monday=s=>addD(s,-((pd(s).getDay()+6)%7));
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const tm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const cfg=window.APP_CONFIG||{};
const sb=(window.supabase&&cfg.SUPABASE_URL&&!/YOUR/.test(cfg.SUPABASE_URL))?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
let S={teachers:[],students:[],lessons:[]},ME=null;
const isAdmin=()=>!!ME&&ME.role==='admin',canEdit=()=>!!ME&&(ME.role==='admin'||ME.role==='staff');
const COLS=['teachers','students','lessons'],shadow={teachers:{},students:{},lessons:{},rates:{}};
const toRow={
 teachers:t=>({id:t.id,name:t.name,inst:t.inst||[]}),
 students:x=>({id:x.id,name:x.name,teacher_ids:x.tids||[]}),
 lessons:l=>({id:l.id,lesson_date:l.date,start_min:l.start,dur:l.dur,room:l.room,teacher_id:l.teacher||null,students:l.students,inst:l.inst})};
const fromRow={
 teachers:r=>({id:r.id,name:r.name,inst:r.inst||[]}),
 students:r=>({id:r.id,name:r.name,tids:r.teacher_ids||[]}),
 lessons:r=>({id:r.id,date:r.lesson_date,start:r.start_min,dur:r.dur,room:r.room,teacher:r.teacher_id||'',students:r.students||[],inst:r.inst})};
const rj=x=>JSON.stringify([x.rate1??null,x.rateG??null]);
const banner=m=>{const b=document.getElementById('bn');b.textContent=m||'';b.style.display=m?'':'none'};
function syncShadow(){COLS.forEach(c=>{shadow[c]={};S[c].forEach(x=>shadow[c][x.id]=JSON.stringify(toRow[c](x)))});shadow.rates={};S.students.forEach(x=>shadow.rates[x.id]=rj(x))}
async function loadAll(){
 const rs=await Promise.all(COLS.map(n=>sb.from(n).select('*')));
 rs.forEach(r=>{if(r.error)throw r.error});
 COLS.forEach((c,i)=>S[c]=rs[i].data.map(fromRow[c]));
 if(isAdmin()){const r=await sb.from('student_rates').select('*');if(r.error)throw r.error;
  r.data.forEach(x=>{const st=S.students.find(y=>y.id===x.student_id);if(st){if(x.rate1!=null)st.rate1=+x.rate1;if(x.rate_g!=null)st.rateG=+x.rate_g}})}
 syncShadow();
}
let saving=Promise.resolve(),busy=0,again=0;
function save(){if(!sb||!canEdit())return;busy++;saving=saving.then(doSave).catch(fail).finally(()=>{busy--;if(!busy&&again){again=0;loadAll().then(refresh).catch(()=>{})}})}
async function doSave(){
 for(const c of COLS){
  const cur={};S[c].forEach(x=>cur[x.id]=x);
  const up=Object.keys(cur).filter(id=>shadow[c][id]!==JSON.stringify(toRow[c](cur[id]))).map(id=>toRow[c](cur[id]));
  const del=Object.keys(shadow[c]).filter(id=>!cur[id]);
  if(up.length){const r=await sb.from(c).upsert(up);if(r.error)throw r.error}
  if(del.length){const r=await sb.from(c).delete().in('id',del);if(r.error)throw r.error}
 }
 if(isAdmin()){
  const up=S.students.filter(x=>shadow.rates[x.id]!==rj(x)).map(x=>({student_id:x.id,rate1:x.rate1??null,rate_g:x.rateG??null}));
  if(up.length){const r=await sb.from('student_rates').upsert(up);if(r.error)throw r.error}
 }
 syncShadow();
}
async function fail(e){
 const conflict=e&&(e.code==='23P01'||/23P01|exclusion/.test(e.message||''));
 banner('變更未能儲存：'+(conflict?'該時段已被其他人先排了（琴房、老師或學生衝突），已重新載入最新課表。':((e&&e.message)||'沒有權限或網路中斷')));
 try{await loadAll()}catch(_){}
 refresh();setTimeout(()=>banner(''),9000);
}
function refresh(){const a=document.activeElement;if(a&&a.tagName==='INPUT'&&$('#app').contains(a)){pend=true;return}pend=false;const y=scrollY;render();scrollTo(0,y)}
let pend=false;
document.addEventListener('focusout',()=>{if(pend)setTimeout(refresh,0)});
function applyRole(){
 if(!canEdit())document.querySelectorAll('#app .add,#app [data-x],#app [data-es],#newL').forEach(e=>e.style.display='none');
 if(!isAdmin()){const o=$('#ov');if(o)o.style.display='none';document.querySelectorAll('#app [data-open]').forEach(e=>e.style.cursor='default')}
}
let tab='sched',sel=ds(new Date()),qv='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const tn=id=>(S.teachers.find(t=>t.id===id)||{name:''}).name;
const sn=id=>(S.students.find(t=>t.id===id)||{name:'?'}).name;
const col=i=>COLORS[INSTS.indexOf(i)%COLORS.length];
const type=l=>l.inst==='出租'?'租借':l.students.length>1?'團體班':'一對一';
const ov=(a,b)=>a.date===b.date&&a.start<b.start+b.dur&&b.start<a.start+a.dur;

function validate(l,isNew){
 const e=[],R=l.inst==='出租',o=S.lessons.filter(x=>x.id!==l.id&&ov(x,l));
 if(!l.date)e.push('請選擇日期');
 if(!R&&!l.teacher)e.push('請選擇老師');
 if(!l.students.length)e.push(R?'請選擇租借者':'請至少選擇一位學生');
 if(l.start+l.dur>H1*60)e.push('課程需在 24:00 前結束');
 if(isNew&&l.date&&pd(l.date).getTime()+l.start*60000<Date.now())e.push('這個時間已經過去，無法新增');
 if(l.inst==='鋼琴'&&!ROOMS[l.room].piano)e.push(l.room+' 琴房沒有鋼琴，鋼琴課請排 A 或 C');
 if(!R&&l.students.length>1&&!ROOMS[l.room].group)e.push('多人團體班只能排在 C 琴房');
 const t=S.teachers.find(x=>x.id===l.teacher);
 if(!R&&t&&!t.inst.includes(l.inst))e.push(t.name+'沒有教授「'+l.inst+'」');
 const rg=x=>tm(x.start)+'–'+tm(x.start+x.dur);
 o.filter(x=>x.room===l.room).forEach(x=>e.push(l.room+' 琴房 '+rg(x)+' 已有課程'));
 if(l.teacher)o.filter(x=>x.teacher===l.teacher).forEach(x=>e.push(tn(l.teacher)+' 在 '+rg(x)+' 已有課程（'+x.room+' 琴房）'));
 o.forEach(x=>x.students.filter(s=>l.students.includes(s)).forEach(s=>e.push(sn(s)+' 在 '+rg(x)+' 已有課程')));
 return e;
}

function render(){
 $('#nav').innerHTML=[['sched','課表'],['people','老師與學生']].filter(x=>x[0]==='sched'||canEdit()).map(([k,v])=>`<button class="${tab===k?'on':''}" data-t="${k}">${v}</button>`).join('');
 $('#app').innerHTML=tab==='sched'?rSched():rPeople();
 if(tab==='sched')applyQ();
 applyRole();
}
function applyQ(){const q=qv.trim().toLowerCase();document.querySelectorAll('.les').forEach(el=>el.classList.toggle('dim',!!q&&!el.dataset.s.includes(q)))}

function rSched(){
 const today=ds(new Date()),nm=nowMin(),wk=[...Array(7)].map((_,i)=>addD(monday(sel),i));
 let tcs='';for(let h=H0;h<=H1;h++)tcs+=`<span style="top:${(h-H0)*60}px">${h}:00</span>`;
 const now=sel===today&&nm>=H0*60&&nm<=H1*60?`<div class="now" style="top:${nm-H0*60}px"></div>`:'';
 const cols=Object.keys(ROOMS).map(r=>{
  const ls=S.lessons.filter(l=>l.date===sel&&l.room===r).map(l=>{
   const past=sel<today||(sel===today&&l.start+l.dur<nm);
   return `<div class="les${past?' past':''}" data-id="${l.id}" data-s="${esc((tn(l.teacher)+' '+l.students.map(sn).join(' ')).toLowerCase())}" style="--c:${col(l.inst)};top:${l.start-H0*60}px;height:${l.dur-2}px"><b>${tm(l.start)}–${tm(l.start+l.dur)} ${esc(l.inst)}</b>${esc(tn(l.teacher)||'')}<br><em>${type(l)}：${l.students.map(s=>esc(sn(s))).join('、')}</em></div>`}).join('');
  return `<div class="col" data-room="${r}">${now}${ls}</div>`}).join('');
 const hds=Object.keys(ROOMS).map(r=>`<div class="hd"><b>${r} 琴房</b><small>${ROOMS[r].note}</small></div>`).join('');
 const db=wk.map((d,i)=>{const x=pd(d);return `<button data-sel="${d}" class="${d===sel?'on':''}${d===today?' td':''}">週${'一二三四五六日'[i]}<small>${x.getMonth()+1}/${x.getDate()}</small></button>`}).join('');
 return `<div class="bar"><h2>${fmt(sel)}${sel===today?'（今天）':''}</h2><input type="search" id="q" placeholder="搜尋老師或學生" value="${esc(qv)}" style="width:190px"><input type="date" id="gd" value="${sel}"><button class="btn ghost" data-sel="${today}">回到今天</button><button class="btn" id="newL">＋ 新增課程</button></div>
 <div class="days"><button data-w="-7">‹ 上週</button>${db}<button data-w="7">下週 ›</button></div>
 <div class="wrap"><div class="grid"><div class="hd" style="border-left:0"></div>${hds}<div class="tc">${tcs}</div>${cols}</div></div>
 <div class="legend">${INSTS.map(i=>`<span style="--c:${col(i)}"><i></i>${i}</span>`).join('')}</div>
 <div class="rules"><b>排課規則（系統自動檢查）</b><ul><li>同一天同一時段，同一間琴房、同一位老師、同一位學生不能重複排課</li><li>鋼琴課只能排 A、C 琴房；小提琴、大提琴、其他課程、出租三間皆可</li><li>多人團體班只能排 C 琴房；出租不需指定老師，學生欄填租借者</li><li>已過去的時間不能新增課程；紅線為目前時間（${tm(nm)}）</li></ul></div>`;
}

const pick=(id,ph,items,type,on)=>`<input type="search" data-f="#${id} label" placeholder="${ph}"><div class="pick" id="${id}">${items.map(x=>`<label data-n="${esc(x.name.toLowerCase())}"><input type="${type}" name="${id}" value="${x.id}"${on(x.id)?' checked':''}>${esc(x.name)}</label>`).join('')||'<span class="empty">尚無資料，請先到「老師與學生」新增</span>'}</div>`;

function openL(src){
 const isNew=!src.id,l=JSON.parse(JSON.stringify(src)),dlg=$('#dlg');
 let showAll=false;const rep={on:false,n:1,skip:false};
 const times=[];for(let m=H0*60;m<H1*60;m+=15)times.push(m);
 const opt=(v,t,s)=>`<option value="${esc(v)}"${s?' selected':''}>${esc(t)}</option>`;
 const tList=()=>l.inst==='出租'?[{id:'',name:'（不指定）'},...S.teachers]:S.teachers.filter(t=>(t.inst||[]).includes(l.inst)||t.id===l.teacher);
 const sList=()=>l.teacher&&!showAll?S.students.filter(x=>(x.tids||[]).includes(l.teacher)||l.students.includes(x.id)):S.students;
 const tHtml=()=>{const L=tList();return L.length?pick('fT','搜尋老師',L,'radio',id=>id===l.teacher):`<div class="empty">目前沒有老師教授「${esc(l.inst)}」。請管理者在老師詳情中勾選教授內容。</div>`};
 const sHtml=()=>{const L=sList(),f=l.teacher&&!showAll;return `<small style="color:var(--mut)">${f?'僅顯示「'+esc(tn(l.teacher))+'」的指導學生（'+L.length+' 位）':'顯示全部學生（'+L.length+' 位）'}</small>`+(L.length?pick('fS','搜尋學生',L,'checkbox',id=>l.students.includes(id)):'<div class="empty">此老師尚未指定學生。請到「老師與學生」編輯學生並設定指導老師，或勾選「顯示全部學生」。</div>')};
 dlg.innerHTML=`<h2>${isNew?'新增課程':'編輯課程'}</h2>
 <div class="f2"><label class="f"><span>課程類別</span><select id="fi">${INSTS.map(i=>opt(i,i,i===l.inst)).join('')}</select></label>
 <label class="f"><span>琴房</span><select id="fr">${Object.keys(ROOMS).map(r=>opt(r,r+' 琴房',r===l.room)).join('')}</select></label></div>
 <div class="f2"><label class="f"><span>日期</span><input type="date" id="fd" value="${l.date}"></label>
 <label class="f"><span>開始時間</span><select id="fs">${times.map(m=>opt(m,tm(m),m===l.start)).join('')}</select></label></div>
 <label class="f"><span>時長</span><select id="fl">${[30,45,60,90,120,180].map(m=>opt(m,m+' 分鐘',m===l.dur)).join('')}</select></label>
 ${isNew?`<div class="f"><label class="chk"><input type="checkbox" id="rp"> 每週同一時段重複</label><div id="rpw" style="display:none"><div class="f2"><label class="f"><span>共幾週（含本週，2–52）</span><input type="number" id="rn" min="2" max="52" value="12"></label><label class="chk" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="rs"> 略過有衝突的日期</label></div></div></div>`:''}
 <div class="f"><span>老師${l.inst==='出租'?'（出租可不選）':'（僅列出教授此類別的老師）'}</span><div id="fTw">${tHtml()}</div></div>
 <div class="f"><span>學生／租借者　<b id="fsel"></b></span><label class="chk"><input type="checkbox" id="fall"> 顯示全部學生（含非此老師指導的學生）</label><div id="fSw">${sHtml()}</div></div>
 <div class="err" id="ferr"></div><div class="info" id="finfo"></div>
 <div class="acts">${isNew?'':'<button class="btn del" id="bd">刪除</button>'}<button class="btn ghost" id="bc">取消</button><button class="btn" id="bs">儲存課程</button></div>`;
 const read=()=>{
  l.inst=$('#fi').value;l.room=$('#fr').value;l.date=$('#fd').value;l.start=+$('#fs').value;l.dur=+$('#fl').value;
  const t=dlg.querySelector('#fT input:checked');l.teacher=t?t.value:'';
  l.students=[...dlg.querySelectorAll('#fS input:checked')].map(x=>x.value);
  showAll=$('#fall').checked;
  rep.on=isNew&&$('#rp').checked;rep.n=isNew?Math.max(2,Math.min(52,+$('#rn').value||2)):1;rep.skip=isNew&&$('#rs').checked;
  if(isNew)$('#rpw').style.display=rep.on?'':'none';
 };
 const occ=()=>[...Array(rep.on?rep.n:1)].map((_,k)=>Object.assign({},l,{date:l.date?addD(l.date,7*k):l.date}));
 const check=()=>{const os=occ(),first=validate(os[0],isNew),bad=[];
  if(!first.length)for(let k=1;k<os.length;k++)if(validate(os[k],false).length)bad.push(os[k].date);
  return{os,first,bad}};
 const fd=d=>{const x=pd(d);return (x.getMonth()+1)+'/'+x.getDate()};
 const upd=e=>{
  const id=e&&e.target&&e.target.id,nm=e&&e.target&&e.target.name;
  read();
  if(id==='fi'){if(!tList().some(t=>t.id===l.teacher))l.teacher='';$('#fTw').innerHTML=tHtml()}
  if(id==='fi'||nm==='fT'||id==='fall'){$('#fSw').innerHTML=sHtml()}
  $('#fsel').textContent='已選 '+l.students.length+' 位・'+(l.inst==='出租'?'租借':l.students.length>1?'團體班':'一對一');
  const c=check(),er=[...c.first];let info='';
  if(rep.on&&!c.first.length){
   if(c.bad.length&&!rep.skip)er.push('以下日期有衝突：'+c.bad.map(fd).join('、')+'（可勾選「略過有衝突的日期」）');
   else info='將建立 '+(c.os.length-c.bad.length)+' 堂課（'+fd(c.os[0].date)+' 起，共 '+c.os.length+' 週）'+(c.bad.length?'，略過 '+c.bad.length+' 個衝突日期：'+c.bad.map(fd).join('、'):'');
  }
  $('#ferr').innerHTML=er.map(x=>`<div>${esc(x)}</div>`).join('');$('#finfo').textContent=info;$('#bs').disabled=!!er.length;
 };
 dlg.oninput=e=>upd(e);upd();
 $('#bc').onclick=()=>dlg.close();
 $('#bs').onclick=()=>{upd();const c=check();if(c.first.length||(c.bad.length&&!rep.skip))return;
  if(isNew)c.os.filter(o=>!c.bad.includes(o.date)).forEach(o=>S.lessons.push(Object.assign({},o,{id:uid('l')})));
  else S.lessons[S.lessons.findIndex(x=>x.id===l.id)]=l;
  sel=l.date;save();dlg.close();render()};
 if(!isNew)$('#bd').onclick=()=>ask('刪除這堂課程？',fmt(l.date)+' '+tm(l.start)+'–'+tm(l.start+l.dur)+'・'+l.room+' 琴房・'+l.inst+'。此操作無法復原。',()=>{S.lessons=S.lessons.filter(x=>x.id!==l.id);save();dlg.close();render()});
 dlg.showModal();
}

function openS(id){
 const st=S.students.find(x=>x.id===id),d=$('#sdlg');if(!st)return;
 d.innerHTML=`<h2>編輯學生</h2><label class="f"><span>姓名</span><input id="en" value="${esc(st.name)}"></label>
 <div class="f"><span>指導老師（可多選；排課選了老師後，只會列出他的學生）</span>${pick('eT','搜尋老師',S.teachers,'checkbox',x=>(st.tids||[]).includes(x))}</div>
 <div class="acts"><button class="btn ghost" id="ec">取消</button><button class="btn" id="es">儲存</button></div>`;
 $('#ec').onclick=()=>d.close();
 $('#es').onclick=()=>{const n=$('#en').value.trim();if(!n)return;st.name=n;st.tids=[...d.querySelectorAll('#eT input:checked')].map(x=>x.value);save();d.close();render()};
 d.showModal();
}

function rPeople(){
 const tl=S.teachers.map(t=>`<div class="row" data-n="${esc((t.name+' '+t.inst.join(' ')).toLowerCase())}"><div data-open="t:${t.id}"><b>${esc(t.name)}</b><br><small>教授：${t.inst.map(esc).join('、')||'未設定'}</small></div><button class="btn del" data-x="t:${t.id}">刪除</button></div>`).join('')||'<div class="empty">尚無老師</div>';
 const sl=S.students.map(t=>{const gt=(t.tids||[]).map(tn).filter(Boolean),n=S.lessons.filter(l=>l.students.includes(t.id)&&l.inst!=='出租').length;return `<div class="row" data-n="${esc((t.name+' '+gt.join(' ')).toLowerCase())}"><div data-open="s:${t.id}"><b>${esc(t.name)}</b><br><small>指導：${esc(gt.join('、')||'未設定')}・${n} 堂課${isAdmin()?'・點擊查看':''}</small></div><span style="display:flex;gap:6px"><button class="btn ghost" data-es="${t.id}">編輯</button><button class="btn del" data-x="s:${t.id}">刪除</button></span></div>`}).join('')||'<div class="empty">尚無學生</div>';
 return `<div class="bar"><h2>老師與學生</h2><button class="btn" id="ov">本月總覽</button></div><div class="two"><div class="panel"><h2>老師 <small>共 ${S.teachers.length} 位</small></h2><div class="add"><input id="tn" placeholder="老師姓名"><div class="chips" id="ti">${INSTS.filter(i=>i!=='出租').map(i=>`<label><input type="checkbox" value="${i}">${i}</label>`).join('')}</div><button class="btn" id="addT">新增老師</button></div><input type="search" data-f="#tl .row" placeholder="搜尋老師姓名或樂器"><div class="list" id="tl">${tl}</div></div>
 <div class="panel"><h2>學生 <small>共 ${S.students.length} 位</small></h2><div class="add"><input id="sn" placeholder="學生姓名"><button class="btn" id="addS">新增學生</button></div><input type="search" data-f="#sl .row" placeholder="搜尋學生姓名"><div class="list" id="sl">${sl}</div></div></div>`;
}

document.addEventListener('input',e=>{
 const f=e.target.dataset.f;
 if(f){const q=e.target.value.trim().toLowerCase();document.querySelectorAll(f).forEach(el=>el.style.display=(el.dataset.n||'').includes(q)?'':'none')}
 if(e.target.id==='q'){qv=e.target.value;applyQ()}
});
document.addEventListener('change',e=>{if(e.target.id==='gd'&&e.target.value){sel=e.target.value;render()}});
document.addEventListener('click',e=>{
 const T=e.target,g=id=>$('#'+id);
 const t=T.closest('[data-t]');if(t){tab=t.dataset.t;return render()}
 const s=T.closest('[data-sel]');if(s){sel=s.dataset.sel;return render()}
 const w=T.closest('[data-w]');if(w){sel=addD(sel,+w.dataset.w);return render()}
 if(tab==='sched'&&canEdit()){
  if(T.closest('#newL'))return openL({date:sel,start:960,dur:60,room:'A',teacher:'',students:[],inst:'鋼琴'});
  const les=T.closest('.les');if(les)return openL(S.lessons.find(l=>l.id===les.dataset.id));
  const c=T.closest('.col');if(c){const y=e.clientY-c.getBoundingClientRect().top;const st=Math.min(H1*60-30,H0*60+Math.floor(y/30)*30);
   return openL({date:sel,start:st,dur:st+60>H1*60?30:60,room:c.dataset.room,teacher:'',students:[],inst:c.dataset.room==='B'?'小提琴':'鋼琴'})}
 }
 if(T.id==='addT'){const n=g('tn').value.trim();if(!n)return;S.teachers.push({id:uid('t'),name:n,inst:[...document.querySelectorAll('#ti input:checked')].map(x=>x.value)});save();render()}
 if(T.id==='addS'){const n=g('sn').value.trim();if(!n)return;S.students.push({id:uid('s'),name:n});save();render()}
 const es=T.closest('[data-es]');if(es)return openS(es.dataset.es);
 const x=T.dataset.x;if(x){const[k,a]=x.split(':');
  if(k==='t'){const n=S.lessons.filter(l=>l.teacher===a).length;
   return ask('刪除老師「'+tn(a)+'」？','將同時移除其 '+n+' 堂課程（含已上過的紀錄），此操作無法復原。',()=>{S.teachers=S.teachers.filter(t=>t.id!==a);S.lessons=S.lessons.filter(l=>l.teacher!==a);S.students.forEach(s=>s.tids=(s.tids||[]).filter(i=>i!==a));save();render()})}
  if(k==='s'){const m=S.lessons.filter(l=>l.students.includes(a)),z=m.filter(l=>l.students.length===1).length;
   return ask('刪除學生「'+sn(a)+'」？','將從 '+m.length+' 堂課程中移除，其中 '+z+' 堂因沒有其他學生而一併刪除（含已上過的紀錄），此操作無法復原。',()=>{S.students=S.students.filter(t=>t.id!==a);S.lessons.forEach(l=>l.students=l.students.filter(s=>s!==a));S.lessons=S.lessons.filter(l=>l.students.length);save();render()})}}
 const o=T.closest('[data-open]');if(o){if(!isAdmin())return;const[k,id]=o.dataset.open.split(':');return askPw(()=>showDetail(k,id))}
 const om=T.closest('[data-om]');if(om)return showOverview(om.dataset.om);
 if(T.id==='ov')return askPw(()=>showOverview());
 const mo=T.closest('[data-mo]');if(mo)return showDetail(dt.k,dt.id,mo.dataset.mo);
 if(T.id==='dc')$('#ddlg').close();
 if(T.id==='sf'){const st=S.students.find(x=>x.id===dt.id),v=id=>{const n=g(id).value;return n===''?undefined:Math.max(0,+n)};st.rate1=v('rf1');st.rateG=v('rfg');save();showDetail(dt.k,dt.id,dt.mo);$('#fmsg').textContent='已儲存'}
});
function ask(title,msg,ok){const d=$('#cdlg');d.innerHTML=`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="acts"><button class="btn ghost" id="cn">取消</button><button class="btn red" id="cy">確認刪除</button></div>`;$('#cn').onclick=()=>d.close();$('#cy').onclick=()=>{d.close();ok()};d.showModal()}
let dt=null;
const hrs=m=>(+(m/60).toFixed(2))+' 小時';
const addM=(mo,n)=>{const d=new Date(+mo.slice(0,4),+mo.slice(5)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const done=l=>pd(l.date).getTime()+(l.start+l.dur)*60000<=Date.now();
const sum=ls=>({n:ls.length,m:ls.reduce((a,l)=>a+l.dur,0),dn:ls.filter(done).length,dm:ls.filter(done).reduce((a,l)=>a+l.dur,0)});
const stat=(t,s)=>`<div class="stat"><small>${t}</small><b>${s.n} 堂・${hrs(s.m)}</b><small>已完成 ${s.dn} 堂・${hrs(s.dm)}</small></div>`;
const rate=(sid,g)=>{const x=S.students.find(y=>y.id===sid)||{};return +(g?x.rateG:x.rate1)||0};
const money=n=>Math.round(n).toLocaleString('zh-TW')+' 元';
const sfee=(l,sid)=>rate(sid,l.students.length>1)*l.dur/60;
const lbl=l=>l.date.slice(5).replace('-','/')+' 週'+WK[pd(l.date).getDay()]+' '+tm(l.start)+'–'+tm(l.start+l.dur);
function askPw(next){if(isAdmin())next()}
function showDetail(k,id,mo){
 const c=new Date();mo=mo||c.getFullYear()+'-'+pad(c.getMonth()+1);dt={k,id,mo};
 const all=S.lessons.filter(l=>l.inst!=='出租'&&(k==='t'?l.teacher===id:l.students.includes(id)));
 const key=l=>l.date+pad(l.start/60|0)+pad(l.start%60);
 const ml=all.filter(l=>l.date.slice(0,7)===mo).sort((x,y)=>key(x).localeCompare(key(y)));
 let h=`<h2>${esc(k==='t'?tn(id):sn(id))}</h2>`;
 const nav=`<div class="mnav"><button class="btn ghost" data-mo="${addM(mo,-1)}">‹</button><b>${mo.slice(0,4)}年${+mo.slice(5)}月</b><button class="btn ghost" data-mo="${addM(mo,1)}">›</button></div>`;
 if(k==='t'){
  const t=S.teachers.find(x=>x.id===id);
  h+=`<div class="f"><span>教授內容（勾選後自動儲存）</span><div class="chips">${INSTS.filter(i=>i!=='出租').map(i=>`<label><input type="checkbox" data-ti="${i}"${t.inst.includes(i)?' checked':''}>${i}</label>`).join('')}</div></div>`+nav;
  const one=ml.filter(l=>l.students.length===1),grp=ml.filter(l=>l.students.length>1),by={};
  one.forEach(l=>{const s=l.students[0];by[s]=by[s]||{n:0,m:0,f:0};by[s].n++;by[s].m+=l.dur;by[s].f+=sfee(l,s)});
  const f1=Object.values(by).reduce((a,v)=>a+v.f,0);
  const miss=one.some(l=>!rate(l.students[0],false));
  h+=`<div class="stats">${stat('本月上課',sum(ml))}<div class="stat"><small>本月課時費合計</small><b>${money(f1)}</b><small>僅計一對一，團體班只列堂數</small></div></div>${miss?'<small style="color:var(--bad)">部分學生尚未設定課時費，以 0 元計算（請到學生詳情頁填寫）</small>':''}`;
  h+=`<input type="search" data-f="#dl .row,#dg .row" placeholder="搜尋學生" style="margin-top:8px"><div class="list" style="max-height:300px"><b>一對一（依學生）</b><div id="dl">${Object.entries(by).sort((x,y)=>y[1].m-x[1].m).map(([s,v])=>{const r=rate(s,false);return `<div class="row s" data-n="${esc(sn(s).toLowerCase())}"><span>${esc(sn(s))}<br><small>${v.n} 堂・${hrs(v.m)}・${r?r+' 元/小時':'未設定課時費'}</small></span><span>${money(v.f)}</span></div>`}).join('')||'<div class="empty">本月沒有一對一課程</div>'}</div>
  <b style="display:block;margin-top:12px">團體班（共 ${grp.length} 堂）</b><div id="dg">${grp.map(l=>`<div class="row s" data-n="${esc(l.students.map(sn).join(' ').toLowerCase())}"><span>${lbl(l)}・${l.room} 琴房・${esc(l.inst)}<br><small>學生 ${l.students.length} 位：${l.students.map(x=>esc(sn(x))).join('、')}</small></span></div>`).join('')||'<div class="empty">本月沒有團體班</div>'}</div></div>`;
 }else{
  const st=S.students.find(x=>x.id===id),f=ls=>ls.reduce((a,l)=>a+sfee(l,id),0);
  h+=`<small style="color:var(--mut)">指導老師：${esc((st.tids||[]).map(tn).filter(Boolean).join('、')||'未設定')}</small>`;
  h+=`<div class="f"><span>課時費（元／小時，可隨時修改）</span><div class="f2"><label class="f"><span>一對一</span><input type="number" min="0" id="rf1" value="${st.rate1??''}" placeholder="例如 800"></label><label class="f"><span>團體班</span><input type="number" min="0" id="rfg" value="${st.rateG??''}" placeholder="例如 500"></label></div><div class="acts" style="align-items:center"><small id="fmsg" style="color:var(--mut)"></small><button class="btn" id="sf">儲存課時費</button></div></div>`+nav;
  h+=`<div class="stats">${stat('本月上課',sum(ml))}${stat('有史以來累計',sum(all))}<div class="stat"><small>課時費</small><b>本月 ${money(f(ml))}</b><small>累計 ${money(f(all))}</small></div></div>`;
  h+=`<b>本月課程</b><div class="list" style="max-height:240px">${ml.map(l=>`<div class="row s"><span>${lbl(l)}</span><span>${esc(l.inst)}${l.students.length>1?'（團體班）':''}・${esc(tn(l.teacher))}・${l.room}</span></div>`).join('')||'<div class="empty">本月沒有課程</div>'}</div>`;
 }
 h+=`<div class="acts" style="margin-top:14px"><button class="btn ghost" id="dc">關閉</button></div>`;
 const d=$('#ddlg');d.style.width='';d.innerHTML=h;if(!d.open)d.showModal();
}
function showOverview(mo){
 const c=new Date();mo=mo||c.getFullYear()+'-'+pad(c.getMonth()+1);dt=null;
 const ml=S.lessons.filter(l=>l.inst!=='出租'&&l.date.slice(0,7)===mo);
 const tr=S.teachers.map(t=>{const ls=ml.filter(l=>l.teacher===t.id),one=ls.filter(l=>l.students.length===1);return{name:t.name,o:one.length,g:ls.length-one.length,f:one.reduce((a,l)=>a+sfee(l,l.students[0]),0)}}).sort((a,b)=>b.f-a.f);
 const sr=S.students.map(x=>{const ls=ml.filter(l=>l.students.includes(x.id));return{name:x.name,n:ls.length,m:ls.reduce((a,l)=>a+l.dur,0),f:ls.reduce((a,l)=>a+sfee(l,x.id),0)}}).sort((a,b)=>b.f-a.f);
 const tot=a=>money(a.reduce((x,r)=>x+r.f,0));
 const row=(r,sub)=>`<div class="row s" data-n="${esc(r.name.toLowerCase())}"><span>${esc(r.name)}<br><small>${sub}</small></span><span>${money(r.f)}</span></div>`;
 const d=$('#ddlg');d.style.width='min(900px,96vw)';
 d.innerHTML=`<h2>本月總覽</h2><div class="mnav"><button class="btn ghost" data-om="${addM(mo,-1)}">‹</button><b>${mo.slice(0,4)}年${+mo.slice(5)}月</b><button class="btn ghost" data-om="${addM(mo,1)}">›</button></div>
 <small style="color:var(--mut)">老師費用只計一對一，團體班只列堂數；學生費用含團體班。出租不計入。未設定課時費者以 0 元計。</small>
 <div class="two" style="margin-top:10px"><div class="panel"><h2>老師 <small>${tr.length} 位・合計 ${tot(tr)}</small></h2><input type="search" data-f="#ot .row" placeholder="搜尋老師"><div class="list" id="ot" style="max-height:340px">${tr.map(r=>row(r,'一對一 '+r.o+' 堂・團體班 '+r.g+' 堂')).join('')||'<div class="empty">尚無老師</div>'}</div></div>
 <div class="panel"><h2>學生 <small>${sr.length} 位・合計 ${tot(sr)}</small></h2><input type="search" data-f="#os .row" placeholder="搜尋學生"><div class="list" id="os" style="max-height:340px">${sr.map(r=>row(r,r.n+' 堂・'+hrs(r.m))).join('')||'<div class="empty">尚無學生</div>'}</div></div></div>
 <div class="acts" style="margin-top:14px"><button class="btn ghost" id="dc">關閉</button></div>`;
 if(!d.open)d.showModal();
}
$('#ddlg').addEventListener('close',()=>{if(tab==='people')render()});
document.addEventListener('change',e=>{
 if(e.target.dataset.ti&&dt){const t=S.teachers.find(x=>x.id===dt.id);t.inst=[...document.querySelectorAll('#ddlg [data-ti]:checked')].map(x=>x.dataset.ti);save()}
});
setInterval(()=>{const a=document.activeElement;if(tab==='sched'&&!$('#dlg').open&&!(a&&a.tagName==='INPUT')){const y=scrollY;render();scrollTo(0,y)}},60000);
render();
const ROLE_TXT={admin:'管理者',staff:'櫃檯',teacher:'老師'};
function showLogin(msg){$('#login').style.display='flex';$('#lerr').textContent=msg||''}
async function start(session){
 const r=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(r.error||!r.data||!ROLE_TXT[r.data.role]){await sb.auth.signOut();showLogin('此帳號尚未開通，請聯絡管理者。');return}
 ME={role:r.data.role,teacher_id:r.data.teacher_id,email:session.user.email};
 $('#who').innerHTML=esc(session.user.email)+'（'+ROLE_TXT[ME.role]+'）<button class="btn ghost" id="lo" style="margin-left:8px;padding:4px 10px">登出</button>';
 $('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
 try{await loadAll()}catch(e){showLogin('讀取資料失敗：'+(e.message||e));return}
 $('#login').style.display='none';tab='sched';render();
 let rt=null;
 sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(rt);rt=setTimeout(async()=>{if(busy){again=1;return}try{await loadAll();refresh()}catch(e){}},400)}).subscribe();
}
$('#lform').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!sb){$('#lerr').textContent='尚未設定 config.js（請填入 Supabase 網址與金鑰）。';return}
 $('#lerr').textContent='登入中…';
 const r=await sb.auth.signInWithPassword({email:$('#lmail').value.trim(),password:$('#lpw').value});
 if(r.error){$('#lerr').textContent='登入失敗：電子郵件或密碼不正確。';return}
 $('#lpw').value='';await start(r.data.session);
});
(async()=>{
 if(!sb){showLogin('尚未設定 config.js（請填入 Supabase 網址與金鑰）。');return}
 const{data}=await sb.auth.getSession();
 if(data.session)await start(data.session);else showLogin();
})();
</script>
</body>
</html>
